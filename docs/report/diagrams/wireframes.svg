<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#374151">
  <rect width="820" height="430" fill="#ffffff"/>
  <defs>
    <g id="phone">
      <rect x="0" y="0" width="180" height="370" rx="18" fill="#ffffff" stroke="#111827" stroke-width="2"/>
      <rect x="65" y="8" width="50" height="10" rx="5" fill="#111827"/>
      <line x1="0" y1="330" x2="180" y2="330" stroke="#9CA3AF"/>
      <g fill="#9CA3AF"><circle cx="25" cy="345" r="5"/><circle cx="68" cy="345" r="5"/><circle cx="112" cy="345" r="5"/><circle cx="155" cy="345" r="5"/></g>
      <g font-size="7" text-anchor="middle" fill="#6B7280"><text x="25" y="360">Today</text><text x="68" y="360">History</text><text x="112" y="360">Insights</text><text x="155" y="360">Settings</text></g>
    </g>
    <g id="metric">
      <rect x="0" y="0" width="156" height="44" rx="5" fill="#ffffff" stroke="#9CA3AF"/>
      <rect x="8" y="8" width="12" height="12" fill="#D1D5DB"/>
      <rect x="26" y="10" width="50" height="7" fill="#D1D5DB"/>
      <rect x="110" y="8" width="38" height="11" fill="#9CA3AF"/>
      <rect x="8" y="26" width="140" height="4" fill="#E5E7EB"/><rect x="8" y="26" width="90" height="4" fill="#6B7280"/>
      <rect x="8" y="35" width="50" height="4" fill="#E5E7EB"/>
    </g>
    <g id="row">
      <rect x="0" y="0" width="156" height="26" fill="#ffffff" stroke="#D1D5DB"/>
      <rect x="8" y="9" width="24" height="7" fill="#D1D5DB"/><rect x="40" y="9" width="28" height="7" fill="#D1D5DB"/><rect x="76" y="9" width="28" height="7" fill="#D1D5DB"/>
      <rect x="140" y="8" width="9" height="10" fill="#9CA3AF"/>
    </g>
    <g id="field">
      <rect x="0" y="0" width="50" height="6" fill="#9CA3AF"/>
      <rect x="0" y="10" width="156" height="22" rx="4" fill="#ffffff" stroke="#9CA3AF"/>
      <rect x="6" y="17" width="10" height="9" fill="#D1D5DB"/>
    </g>
  </defs>

  <!-- 1 Dashboard -->
  <g transform="translate(20,30)">
    <use href="#phone"/>
    <rect x="12" y="30" width="120" height="10" fill="#6B7280"/>
    <use href="#metric" x="12" y="50"/><use href="#metric" x="12" y="100"/><use href="#metric" x="12" y="150"/>
    <rect x="12" y="204" width="70" height="7" fill="#6B7280"/><rect x="118" y="204" width="50" height="7" fill="#D1D5DB"/>
    <use href="#row" x="12" y="218"/><use href="#row" x="12" y="244"/>
    <circle cx="150" cy="305" r="14" fill="#6B7280"/><text x="150" y="309" fill="#ffffff" font-size="14" text-anchor="middle">+</text>
  </g>
  <!-- 2 History -->
  <g transform="translate(220,30)">
    <use href="#phone"/>
    <rect x="12" y="30" width="60" height="10" fill="#6B7280"/><rect x="128" y="29" width="40" height="12" rx="6" fill="#D1D5DB"/>
    <rect x="12" y="50" width="156" height="20" rx="4" fill="#ffffff" stroke="#9CA3AF"/><text x="22" y="63" fill="#9CA3AF">Search by date…</text>
    <g fill="#ffffff" stroke="#9CA3AF"><rect x="12" y="77" width="24" height="13" rx="6" fill="#6B7280"/><rect x="40" y="77" width="32" height="13" rx="6"/><rect x="76" y="77" width="44" height="13" rx="6"/><rect x="124" y="77" width="44" height="13" rx="6"/></g>
    <rect x="12" y="96" width="156" height="16" rx="8" fill="#ffffff" stroke="#9CA3AF"/><text x="22" y="107" fill="#9CA3AF">Filter by a specific date</text>
    <rect x="12" y="122" width="40" height="7" fill="#6B7280"/><rect x="12" y="132" width="100" height="5" fill="#D1D5DB"/>
    <use href="#row" x="12" y="142"/><use href="#row" x="12" y="168"/>
    <rect x="12" y="204" width="50" height="7" fill="#6B7280"/><rect x="12" y="214" width="100" height="5" fill="#D1D5DB"/>
    <use href="#row" x="12" y="224"/>
    <rect x="12" y="260" width="50" height="7" fill="#6B7280"/><use href="#row" x="12" y="276"/>
  </g>
  <!-- 3 Add record -->
  <g transform="translate(420,30)">
    <use href="#phone"/>
    <rect x="55" y="30" width="70" height="9" fill="#6B7280"/>
    <use href="#field" x="12" y="52"/><use href="#field" x="12" y="92"/><use href="#field" x="12" y="132"/><use href="#field" x="12" y="172"/>
    <rect x="12" y="212" width="50" height="6" fill="#9CA3AF"/><rect x="12" y="222" width="156" height="40" rx="4" fill="#ffffff" stroke="#9CA3AF"/>
    <rect x="12" y="270" width="156" height="12" rx="3" fill="#F3F4F6" stroke="#9CA3AF" stroke-dasharray="3 2"/><text x="18" y="279" font-size="7">validation message</text>
    <rect x="12" y="290" width="156" height="22" rx="5" fill="#6B7280"/><text x="90" y="304" fill="#ffffff" text-anchor="middle">Save record</text>
  </g>
  <!-- 4 Insights -->
  <g transform="translate(620,30)">
    <use href="#phone"/>
    <rect x="12" y="30" width="60" height="10" fill="#6B7280"/>
    <rect x="12" y="50" width="54" height="14" rx="7" fill="#6B7280"/><rect x="72" y="50" width="58" height="14" rx="7" fill="#ffffff" stroke="#9CA3AF"/>
    <g>
      <rect x="12" y="74" width="156" height="72" rx="5" fill="#ffffff" stroke="#9CA3AF"/>
      <rect x="20" y="82" width="60" height="7" fill="#6B7280"/>
      <g fill="#D1D5DB"><rect x="20" y="96" width="50" height="5"/><rect x="20" y="108" width="40" height="5"/><rect x="20" y="120" width="45" height="5"/><rect x="20" y="132" width="55" height="5"/></g>
      <g fill="#9CA3AF"><rect x="118" y="96" width="42" height="5"/><rect x="118" y="108" width="42" height="5"/><rect x="108" y="120" width="52" height="5"/><rect x="124" y="132" width="36" height="5"/></g>
    </g>
    <g transform="translate(0,82)">
      <rect x="12" y="74" width="156" height="72" rx="5" fill="#ffffff" stroke="#9CA3AF"/>
      <rect x="20" y="82" width="60" height="7" fill="#6B7280"/>
      <g fill="#D1D5DB"><rect x="20" y="96" width="50" height="5"/><rect x="20" y="108" width="40" height="5"/><rect x="20" y="120" width="45" height="5"/><rect x="20" y="132" width="55" height="5"/></g>
    </g>
    <g transform="translate(0,164)">
      <rect x="12" y="74" width="156" height="72" rx="5" fill="#ffffff" stroke="#9CA3AF"/>
      <rect x="20" y="82" width="60" height="7" fill="#6B7280"/>
    </g>
  </g>
  <g font-size="12" font-weight="bold" text-anchor="middle" fill="#111827">
    <text x="110" y="20">W1 – Dashboard</text><text x="310" y="20">W2 – History / Search</text>
    <text x="510" y="20">W3 – Add / Edit Record</text><text x="710" y="20">W4 – Insights</text>
  </g>
</svg>
