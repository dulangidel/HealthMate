<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="800" height="330" fill="#ffffff"/>
  <!-- Root stack -->
  <rect x="10" y="10" width="780" height="310" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-dasharray="5 4"/>
  <text x="24" y="32" font-size="11" fill="#64748b" font-weight="bold">ROOT STACK  (src/app/_layout.tsx)</text>
  <!-- Tabs -->
  <rect x="30" y="45" width="520" height="140" rx="10" fill="#EEF2FF" stroke="#4F46E5"/>
  <text x="44" y="66" font-size="11" fill="#4F46E5" font-weight="bold">BOTTOM TABS  ((tabs)/_layout.tsx)</text>
  <g fill="#ffffff" stroke="#4F46E5">
    <rect x="45" y="85" width="112" height="80" rx="8"/><rect x="170" y="85" width="112" height="80" rx="8"/>
    <rect x="295" y="85" width="112" height="80" rx="8"/><rect x="420" y="85" width="112" height="80" rx="8"/>
  </g>
  <g text-anchor="middle">
    <text x="101" y="118" font-weight="bold">Today</text><text x="101" y="138" font-size="11" fill="#64748b">index.tsx</text>
    <text x="226" y="118" font-weight="bold">History</text><text x="226" y="138" font-size="11" fill="#64748b">records.tsx</text>
    <text x="351" y="118" font-weight="bold">Insights</text><text x="351" y="138" font-size="11" fill="#64748b">insights.tsx</text>
    <text x="476" y="118" font-weight="bold">Settings</text><text x="476" y="138" font-size="11" fill="#64748b">settings.tsx</text>
  </g>
  <!-- Form screens -->
  <rect x="600" y="60" width="170" height="70" rx="8" fill="#ffffff" stroke="#16A34A"/>
  <text x="685" y="90" text-anchor="middle" font-weight="bold">Add Record</text>
  <text x="685" y="110" text-anchor="middle" font-size="11" fill="#64748b">record/new.tsx (modal)</text>
  <rect x="600" y="220" width="170" height="70" rx="8" fill="#ffffff" stroke="#EA580C"/>
  <text x="685" y="250" text-anchor="middle" font-weight="bold">Edit Record</text>
  <text x="685" y="270" text-anchor="middle" font-size="11" fill="#64748b">record/[id].tsx (push)</text>
  <!-- arrows -->
  <g stroke="#475569" stroke-width="1.3" fill="none" marker-end="url(#n)">
    <path d="M550 95 L598 95"/>
    <path d="M101 165 L101 255 L598 255"/>
    <path d="M226 165 L226 240 L598 240"/>
    <path d="M685 130 L685 140 L560 140" />
    <path d="M600 280 L240 280 L240 300 L110 300 L110 167" stroke-dasharray="4 3"/>
  </g>
  <g font-size="11" fill="#334155">
    <text x="554" y="86">"+" FAB</text>
    <text x="300" y="250">tap an entry</text>
    <text x="566" y="156">Save → back</text>
    <text x="300" y="297">Save / Delete → back, list re-queries</text>
  </g>
</svg>
