<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="760" height="330" fill="#ffffff"/>
  <!-- health_records -->
  <g>
    <rect x="30" y="20" width="370" height="290" rx="6" fill="#ffffff" stroke="#2563EB" stroke-width="1.5"/>
    <rect x="30" y="20" width="370" height="36" rx="6" fill="#2563EB"/>
    <rect x="30" y="44" width="370" height="12" fill="#2563EB"/>
    <text x="215" y="44" fill="#ffffff" font-weight="bold" text-anchor="middle">health_records</text>
    <g font-size="12.5">
      <text x="45" y="82" font-weight="bold">PK</text><text x="85" y="82" font-weight="bold">id</text><text x="200" y="82">INTEGER AUTOINCREMENT</text>
      <line x1="30" y1="94" x2="400" y2="94" stroke="#e5e7eb"/>
      <text x="85" y="116">date</text><text x="200" y="116">TEXT NOT NULL (YYYY-MM-DD)</text>
      <line x1="30" y1="128" x2="400" y2="128" stroke="#e5e7eb"/>
      <text x="85" y="150">steps</text><text x="200" y="150">INTEGER NOT NULL ≥ 0</text>
      <line x1="30" y1="162" x2="400" y2="162" stroke="#e5e7eb"/>
      <text x="85" y="184">calories</text><text x="200" y="184">INTEGER NOT NULL ≥ 0</text>
      <line x1="30" y1="196" x2="400" y2="196" stroke="#e5e7eb"/>
      <text x="85" y="218">water</text><text x="200" y="218">INTEGER NOT NULL ≥ 0 (ml)</text>
      <line x1="30" y1="230" x2="400" y2="230" stroke="#e5e7eb"/>
      <text x="85" y="252" fill="#6b7280">note</text><text x="200" y="252" fill="#6b7280">TEXT NULL</text>
      <line x1="30" y1="264" x2="400" y2="264" stroke="#e5e7eb"/>
      <text x="85" y="286" fill="#6b7280">created_at, updated_at</text><text x="250" y="286" fill="#6b7280">TEXT</text>
      <text x="45" y="116" fill="#2563EB" font-size="10.5">IDX</text>
    </g>
  </g>
  <!-- app_settings -->
  <g>
    <rect x="470" y="20" width="260" height="130" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
    <rect x="470" y="20" width="260" height="36" rx="6" fill="#475569"/>
    <rect x="470" y="44" width="260" height="12" fill="#475569"/>
    <text x="600" y="44" fill="#ffffff" font-weight="bold" text-anchor="middle">app_settings</text>
    <g font-size="12.5">
      <text x="485" y="82" font-weight="bold">PK</text><text x="525" y="82" font-weight="bold">key</text><text x="600" y="82">TEXT</text>
      <line x1="470" y1="94" x2="730" y2="94" stroke="#e5e7eb"/>
      <text x="525" y="116">value</text><text x="600" y="116">TEXT (JSON)</text>
      <text x="485" y="140" font-size="11" fill="#6b7280">e.g. key = 'daily_goals'</text>
    </g>
  </g>
  <g font-size="11.5" fill="#374151">
    <text x="470" y="190">• The two tables are independent</text>
    <text x="470" y="208">  (no foreign key): goals apply to</text>
    <text x="470" y="226">  all records.</text>
    <text x="470" y="250">• Many records may share one date;</text>
    <text x="470" y="268">  daily totals are computed with</text>
    <text x="470" y="286">  aggregation in the Model layer.</text>
  </g>
</svg>
